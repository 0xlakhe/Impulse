services:
  postgres:
    image: postgres:17

    container_name: impulse-postgres

    environment:
      POSTGRES_DB: impulse
      POSTGRES_USER: impulse
      POSTGRES_PASSWORD: impulse

    ports:
      - "5433:5432"
    
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U impulse -d impulse"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:17

    container_name: impulse-postgres

    environment:
      POSTGRES_DB: impulse
      POSTGRES_USER: impulse
      POSTGRES_PASSWORD: impulse

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U impulse -d impulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://impulse:impulse@postgres:5432/impulse?sslmode=disable
      - up

volumes:
  postgres_data:
